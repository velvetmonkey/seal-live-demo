# SPDX-License-Identifier: Apache-2.0
name: seal · live agent threat demo
on:
  workflow_dispatch:
    inputs:
      model:
        description: GitHub Models model id
        default: openai/gpt-4o-mini

# Unset permissions default to none and break private checkout + Models. (amendment #2)
permissions:
  contents: read
  models: read

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: synthpw
      MODEL: ${{ inputs.model || 'openai/gpt-4o-mini' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}   # optional belt-and-braces
      EVIDENCE_DIR: ${{ github.workspace }}/evidence
      COMPOSE_PARALLEL_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # Immutable "what ran": commit + workflow-file hash, before anything else.
      - name: Pre-run identity
        run: |
          mkdir -p evidence
          WF_HASH=$(sha256sum .github/workflows/demo.yml | cut -d' ' -f1)
          node -e "require('fs').writeFileSync('evidence/run-meta.json', JSON.stringify({commit: process.env.GITHUB_SHA, workflow_hash: '$WF_HASH', model: process.env.MODEL, policy: 'seal-live-demo-d0', kernel_sha256: '1cc765c7de2cead88eda2e8e5f5af5a5e070f35a767916e754b873733562c70a', run_id: process.env.GITHUB_RUN_ID}, null, 2))"
          cat evidence/run-meta.json

      # Fail LOUD if Models is unavailable, BEFORE Docker. Never canned fallback.
      - name: Preflight GitHub Models (real schema)
        run: node agent/preflight.mjs

      - name: Build images
        run: docker compose build

      - name: Up db + gateway (seal ON)
        run: SEAL_DECISION_BYPASS=0 docker compose up -d --wait target-db seal-gateway

      - name: Snapshot prod BEFORE (direct DB query, outside seal)
        run: bash scripts/snapshot_host.sh > evidence/snap-before.json && cat evidence/snap-before.json

      - name: Connectivity probe (assert the topology)
        run: |
          docker compose run --rm -T --entrypoint bash -v "$PWD/scripts:/s" agent /s/probe_connectivity.sh \
            | grep -E '^\{' | tail -n 1 | tee evidence/probe.json
          node -e "const p=require('./evidence/probe.json'); if(p.agent_to_gateway!=='OK'||p.agent_to_db!=='FAIL'||p.DATABASE_URL_in_agent!=='ABSENT'){console.error('topology invariant failed');process.exit(1)}"

      - name: Phase 1 — legitimate task (expect ALLOW)
        run: docker compose run --rm -e PHASE=p1 agent

      - name: Phase 2 — attack, seal ON (expect BLOCK)
        run: docker compose run --rm -e PHASE=p2 agent

      - name: Snapshot prod AFTER P2 (expect unchanged)
        run: bash scripts/snapshot_host.sh > evidence/snap-after-p2.json && cat evidence/snap-after-p2.json

      - name: Phase 3 — same attack, seal OFF (negative control)
        run: |
          SEAL_DECISION_BYPASS=1 docker compose up -d --wait --force-recreate --no-deps seal-gateway
          docker compose run --rm -T -e EVIDENCE_DIR=/evidence -e MCP_URL=http://seal-gateway:8800/mcp \
            -v "$PWD/scripts:/s" --entrypoint node agent /s/replay_p3.mjs

      - name: Snapshot prod AFTER P3 (expect destroyed)
        run: bash scripts/snapshot_host.sh > evidence/snap-after-p3.json && cat evidence/snap-after-p3.json

      - name: Render report to job summary
        run: node scripts/render_summary.mjs

      - name: Assemble bundle.json (for the seal-check / replay PWA)
        run: node scripts/assemble_bundle_json.mjs

      - name: Package evidence bundle
        run: bash scripts/make_bundle.sh evidence.tar.gz

      - name: Assert invariants (green check = evidence)
        run: node scripts/assert.mjs

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-live-demo-evidence
          path: |
            evidence.tar.gz
            evidence/

      - name: Tear down
        if: always()
        run: docker compose down -v || true

# registration nudge 19:37Z
