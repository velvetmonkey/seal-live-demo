# SPDX-License-Identifier: Apache-2.0
# Deploys the bundled seal-check PWA (pwa/) to GitHub Pages. Manual dispatch only.
# The repo is PRIVATE and (on Pro) Pages must be set to PRIVATE visibility before the
# first deploy: the PWA ships the verified seal.wasm, which must stay access-gated
# until the deliberate, audited public flip. Do NOT run this until Pages visibility
# is confirmed Private.
name: deploy seal-check PWA to Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pwa
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
